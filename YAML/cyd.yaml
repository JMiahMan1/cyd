logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  platform: esphome

interval:
  - interval: 5s
    then:
      - lvgl.widget.update:
          id: led_switch
          state:
            checked: !lambda return id(led).remote_values.is_on();
  - interval: 10s
    then:
      - script.execute: sync_media

time:
  - platform: sntp
    id: sntp_time
    servers:
      - ntp0.ntp-servers.net
      - ntp1.ntp-servers.net
      - ntp2.ntp-servers.net
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

touchscreen:
  id: device_touchscreen
  platform: xpt2046
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 30ms
  threshold: 400
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860
  transform:
    mirror_x: true
    mirror_y: true
    swap_xy: true
  on_touch:
    then:
      - script.execute: wake_tap

display:
  - platform: ili9xxx
    id: device_display
    model: ILI9342
    color_order: RGB
    dimensions:
      width: 320
      height: 240
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 0
    invert_colors: false
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    pin: GPIO4
    id: led_red
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_green
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_blue
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: RGB
    id: led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

http_request:

debug:

image:
  - platform: online_image
    id: album_art
    url: "http://album-art.invalid/placeholder.jpg"
    format: JPEG
    type: RGB565
    resize: 52x52
    buffer_size: 6144
    on_download_finished:
      - lambda: |-
          id(album_art).get_lv_image_dsc();
          lv_image_set_src(id(art_img), id(album_art).get_lv_image_dsc());
          ESP_LOGW("cyd_pic", "download finished %dx%d", id(album_art).get_buffer_width(), id(album_art).get_buffer_height());
      - lvgl.widget.hide: art_icon
      - lvgl.widget.show: art_img
      - lvgl.widget.redraw: art_img
    on_error:
      - lambda: ESP_LOGW("cyd_pic", "download error");
      - lvgl.widget.show: art_icon
      - lvgl.widget.hide: art_img
      - lvgl.widget.redraw: art_tile

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: ip_addr
      entity_category: "diagnostic"
      on_value:
        - lvgl.label.update:
            id: sys_ip
            text: !lambda return std::string("IP ") + x;
    ssid:
      id: connected_ssid
      name: SSID
      entity_category: "diagnostic"
    bssid:
      id: connected_bssid
      name: BSSID
      entity_category: "diagnostic"
    mac_address:
      id: device_mac

  - platform: homeassistant
    id: weather_forecast
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - script.execute: weather_update

  - platform: homeassistant
    id: ds_state
    entity_id: ${ds_climate}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ds_state_text
          text: !lambda |-
            if (x == "heat") return {"Heat"};
            if (x == "cool") return {"Cool"};
            if (x == "heat_cool") return {"Auto"};
            return {"Off"};
          text_color: !lambda |-
            if (x == "heat") return id(heat_orange);
            if (x == "cool") return id(cool_blue);
            return id(bg_grey);
      - lvgl.widget.update:
          id: ds_heat
          state:
            checked: !lambda return x == "heat";
      - lvgl.widget.update:
          id: ds_cool
          state:
            checked: !lambda return x == "cool";
      - lvgl.widget.update:
          id: ds_off
          state:
            checked: !lambda return x == "off";

  - platform: homeassistant
    id: us_state
    entity_id: ${us_climate}
    internal: true
    on_value:
      - lvgl.label.update:
          id: us_state_text
          text: !lambda |-
            if (x == "heat") return {"Heat"};
            if (x == "cool") return {"Cool"};
            if (x == "heat_cool") return {"Auto"};
            return {"Off"};
          text_color: !lambda |-
            if (x == "heat") return id(heat_orange);
            if (x == "cool") return id(cool_blue);
            return id(bg_grey);
      - lvgl.widget.update:
          id: us_heat
          state:
            checked: !lambda return x == "heat";
      - lvgl.widget.update:
          id: us_cool
          state:
            checked: !lambda return x == "cool";
      - lvgl.widget.update:
          id: us_off
          state:
            checked: !lambda return x == "off";

  - platform: homeassistant
    id: ds_fan_state
    entity_id: ${ds_climate}
    attribute: fan_mode
    internal: true
    on_value:
      - lvgl.widget.update:
          id: ds_fan
          state:
            checked: !lambda return x == "on";

sensor:
  - platform: wifi_signal
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - platform: debug
    free:
      name: "Heap Free"
      entity_category: "diagnostic"
    block:
      name: "Heap Max Block"
      entity_category: "diagnostic"
    fragmentation:
      name: "Heap Frag"
      entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - lvgl.label.update:
          id: sys_wifi
          text: !lambda |-
            char b[32];
            snprintf(b, sizeof(b), "WiFi Signal %.0f%%", x);
            return {b};

  - platform: uptime
    id: device_uptime
    internal: true
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: sys_uptime
          text: !lambda |-
            int s = (int) x;
            int d = s / 86400;
            s %= 86400;
            int h = s / 3600;
            s %= 3600;
            int m = s / 60;
            char b[32];
            if (d > 0) snprintf(b, sizeof(b), "Online %dd %dh", d, h);
            else if (h > 0) snprintf(b, sizeof(b), "Online %dh %dm", h, m);
            else snprintf(b, sizeof(b), "Online %dm", m);
            return {b};

  - platform: homeassistant
    id: out_temp
    entity_id: ${out_temp_entity}
    internal: true
    on_value:
      - lambda: id(g_out_t) = x;
      - script.execute: update_temps

  - platform: homeassistant
    id: ds_actual
    entity_id: ${ds_climate}
    attribute: current_temperature
    internal: true
    on_value:
      - lambda: id(g_ds_act) = x;
      - script.execute: update_temps

  - platform: homeassistant
    id: ds_humidity
    entity_id: ${ds_climate}
    attribute: current_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: ds_hum
          text: !lambda |-
            if (isnan(x)) return {"--"};
            char b[16];
            snprintf(b, sizeof(b), "%.0f%% RH", x);
            return {b};

  - platform: homeassistant
    id: ds_set
    entity_id: ${ds_climate}
    attribute: temperature
    internal: true
    on_value:
      - lambda: id(g_ds_set) = x;
      - script.execute: update_temps

  - platform: homeassistant
    id: us_actual
    entity_id: ${us_climate}
    attribute: current_temperature
    internal: true
    on_value:
      - lambda: id(g_us_act) = x;
      - script.execute: update_temps

  - platform: homeassistant
    id: us_set
    entity_id: ${us_climate}
    attribute: temperature
    internal: true
    on_value:
      - lambda: id(g_us_set) = x;
      - script.execute: update_temps

  - platform: homeassistant
    id: cur_power
    entity_id: ${cur_power_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: home_energy_now
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "%.1f kW", x);
            return {b};
      - lvgl.label.update:
          id: energy_now
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "%.2f kW", x);
            return {b};

  - platform: homeassistant
    id: daily_energy
    entity_id: ${daily_energy_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: energy_today
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f", x);
            return {b};

  - platform: homeassistant
    id: monthly_energy
    entity_id: ${monthly_energy_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: energy_month
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f", x);
            return {b};

  - platform: homeassistant
    id: energy_cost
    entity_id: ${energy_cost_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: energy_cost_value
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "$%.2f", x);
            return {b};
      - lvgl.label.update:
          id: home_energy_cost
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "$%.2f", x);
            return {b};

binary_sensor:
