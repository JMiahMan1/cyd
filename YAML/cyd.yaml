lvgl:
  buffer_size: 12%
  displays:
    - device_display
  touchscreens:
    - device_touchscreen
  theme:
    label:
      text_font: my_font14
      text_align: CENTER
      text_color: 0x3A1533
      align: CENTER
      scrollbar_mode: "OFF"
      scroll_dir: "NONE"

    button:
      bg_color: 0xA16793
      bg_grad_color: 0x8A4F7E
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x9C6091
      border_width: 1
      text_color: white
      radius: 12
      scrollbar_mode: "OFF"
      scroll_dir: "NONE"
      shadow_color: 0x000000
      shadow_opa: 30%
      shadow_width: 8
      shadow_ofs_y: 2
      shadow_spread: 0
      checked:
        bg_color: 0xFBAB35
        bg_grad_color: 0xE09018
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0xFFD98A
        border_width: 1
        text_color: 0x0B1F33
        radius: 12

    switch:
      bg_color: 0xC9BBD1
      bg_grad_color: 0xB5A6C0
      bg_grad_dir: VER
      bg_opa: COVER
      checked:
        bg_color: 0xFBAB35
        bg_grad_color: 0xE09018
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xC0C0C0
        bg_grad_dir: VER
        bg_opa: COVER

    slider:
      border_width: 1
      border_opa: 15%
      bg_color: 0xcccaca
      bg_opa: 15%
      indicator:
        bg_color: 0xA16793
        bg_grad_color: 0x8A4F7E
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xF0EAF3
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x8A5578
        border_width: 1
        text_color: 0xFFFFFF

  style_definitions:
    - id: nav_bar
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

    - id: sidebar
      width: 32%
      height: 100%
      bg_color: 0x73264D
      bg_grad_color: 0x032341
      bg_grad_dir: VER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      text_align: CENTER
      text_color: white

    - id: content
