            checked: !lambda return id(g_unit) == "F";
      - lvgl.widget.update:
          id: unit_c
          state:
            checked: !lambda return id(g_unit) == "C";
      - script.execute: update_temps
      - script.execute: update_weather_temps

  - id: update_clock_ui
    then:
      - lvgl.widget.update:
          id: clock12
          state:
            checked: !lambda return id(g_clock24) != "1";
      - lvgl.widget.update:
          id: clock24
          state:
            checked: !lambda return id(g_clock24) == "1";
      - lvgl.label.update:
          id: ck_start_lbl
          text: !lambda |-
            char b[8];
            snprintf(b, sizeof(b), "%d:00", atoi(id(g_sleep_start).c_str()));
            return {b};
      - lvgl.label.update:
          id: ck_end_lbl
          text: !lambda |-
            char b[8];
            snprintf(b, sizeof(b), "%d:00", atoi(id(g_sleep_end).c_str()));
            return {b};
      - script.execute: time_update

  - id: weather_update
    then:
      - lvgl.label.update:
          id: display_weather_icon
          text: !lambda |-
            std::string s = id(weather_forecast).state;
            if (s == "clear-night") return {"\U000F0594"};
            if (s == "cloudy") return {"\U000F0590"};
            if (s == "exceptional") return {"\U000F0F37"};
            if (s == "fog") return {"\U000F0591"};
            if (s == "hail") return {"\U000F0592"};
            if (s == "lightning") return {"\U000F0593"};
            if (s == "lightning-rainy") return {"\U000F067E"};
            if (s == "partlycloudy") return {"\U000F0595"};
            if (s == "pouring") return {"\U000F0596"};
            if (s == "rainy") return {"\U000F0597"};
            if (s == "snowy") return {"\U000F0598"};
            if (s == "snowy-rainy") return {"\U000F067F"};
            if (s == "sunny") return {"\U000F0599"};
            if (s == "windy") return {"\U000F059D"};
            if (s == "windy-variant") return {"\U000F059E"};
            return {"\U000F0590"};
      - lvgl.label.update:
          id: display_weather_icon
          text_color: !lambda |-
            std::string s = id(weather_forecast).state;
            if (s == "sunny") return id(amber);
            if (s == "clear-night") return id(light_blue);
            if (s == "rainy" || s == "pouring" || s == "lightning-rainy") return id(light_blue);
            if (s == "lightning") return id(yellow);
            if (s == "snowy" || s == "snowy-rainy" || s == "hail") return id(white);
            return id(white);
      - lvgl.label.update:
          id: display_weather_text
          text: !lambda |-
            std::string s = id(weather_forecast).state;
            if (s == "clear-night") return {"Clear"};
            if (s == "cloudy") return {"Cloudy"};
            if (s == "exceptional") return {"Alert"};
            if (s == "fog") return {"Fog"};
            if (s == "hail") return {"Hail"};
            if (s == "lightning") return {"Storm"};
            if (s == "lightning-rainy") return {"Storms"};
            if (s == "partlycloudy") return {"Partly Cloudy"};
            if (s == "pouring") return {"Heavy Rain"};
            if (s == "rainy") return {"Rain"};
            if (s == "snowy") return {"Snow"};
            if (s == "snowy-rainy") return {"Sleet"};
            if (s == "sunny") return {"Sunny"};
            if (s == "windy") return {"Windy"};
            if (s == "windy-variant") return {"Windy"};
            return {"--"};

  - id: time_update
    then:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            char str[20];
            time_t currTime = id(sntp_time).now().timestamp;
            if (id(g_clock24) == "1") {
              strftime(str, sizeof(str), "%H:%M", localtime(&currTime));
            } else {
              strftime(str, sizeof(str), "%I:%M", localtime(&currTime));
              if (str[0] == '0') memmove(str, str + 1, strlen(str));
            }
            return { str };
      - lvgl.label.update:
          id: display_day
          text: !lambda |-
            static const char * const days_en[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
            static char date_buf[32];
            auto now = id(sntp_time).now();
            snprintf(date_buf, sizeof(date_buf), "%s", days_en[now.day_of_week - 1]);
            return date_buf;
      - lvgl.label.update:
          id: display_date
          text: !lambda |-
            static const char * const mon_en[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
            static char month_buf[32];
            auto now = id(sntp_time).now();
            snprintf(month_buf, sizeof(month_buf), "%s %d", mon_en[now.month - 1], now.day_of_month);
            return month_buf;
      - lvgl.label.update:
          id: saver_time
          text: !lambda |-
            char str[20];
            time_t currTime = id(sntp_time).now().timestamp;
            if (id(g_clock24) == "1") {
              strftime(str, sizeof(str), "%H:%M", localtime(&currTime));
            } else {
              strftime(str, sizeof(str), "%I:%M", localtime(&currTime));
              if (str[0] == '0') memmove(str, str + 1, strlen(str));
            }
            return { str };
      - lvgl.label.update:
          id: saver_ampm
          text: !lambda |-
            if (id(g_clock24) == "1") return std::string("");
            char amp[8];
            time_t currTime = id(sntp_time).now().timestamp;
            strftime(amp, sizeof(amp), "%p", localtime(&currTime));
            return std::string(amp);
      - lvgl.label.update:
          id: saver_day
          text: !lambda |-
            static const char * const days_en2[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
            static char sd_buf[32];
            auto now = id(sntp_time).now();
            snprintf(sd_buf, sizeof(sd_buf), "%s", days_en2[now.day_of_week - 1]);
            return sd_buf;
      - lvgl.label.update:
          id: saver_date
          text: !lambda |-
            static const char * const mon_en2[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
            static char sm_buf[32];
            auto now = id(sntp_time).now();
            snprintf(sm_buf, sizeof(sm_buf), "%s %d", mon_en2[now.month - 1], now.day_of_month);
            return sm_buf;

