                          - label:
                              text_font: icon_font_14
                              text: "\U000F0415"
                        on_click:
                          - lambda: |-
                              int v = atoi(id(g_sleep_end).c_str());
                              v = (v + 1) % 24;
                              char b[4];
                              snprintf(b, sizeof(b), "%d", v);
                              id(g_sleep_end) = b;
                          - script.execute: update_clock_ui
                    - label:
                        text: "Screen stays dark during sleep hours. Set both to the same hour to disable."
                        text_font: my_font8
                        text_color: 0x7A6B84
                        width: 172
                        align: TOP_LEFT
                        translate_x: 16
                        translate_y: 174
