          id: btn_master_r
          state:
            checked: !lambda return x;
      - lvgl.label.update:
          id: lbl_master_r
          text_color: !lambda if (x) return id(bg_blue); return id(white);

  - platform: homeassistant
    id: hall_state
    entity_id: ${light_hall}
    internal: true
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_hall
          state:
            checked: !lambda return x;
      - lvgl.label.update:
          id: lbl_hall
          text_color: !lambda if (x) return id(bg_blue); return id(white);

script:
  - id: nav_set
    parameters:
      page: int
    then:
      - lambda: |-
          id(g_page) = page;
      - lvgl.widget.update:
          id: nav_home
          state:
            checked: !lambda return page == 0;
      - lvgl.label.update:
          id: nav_home_icon
          text_color: !lambda if (page == 0) return id(bg_blue); return id(white);
      - lvgl.widget.update:
          id: nav_climate
          state:
            checked: !lambda return page == 1;
      - lvgl.label.update:
          id: nav_climate_icon
          text_color: !lambda if (page == 1) return id(bg_blue); return id(white);
      - lvgl.widget.update:
          id: nav_energy
          state:
            checked: !lambda return page == 2;
      - lvgl.label.update:
          id: nav_energy_icon
          text_color: !lambda if (page == 2) return id(bg_blue); return id(white);
      - lvgl.widget.update:
          id: nav_settings
          state:
            checked: !lambda return page == 3;
      - lvgl.label.update:
          id: nav_settings_icon
          text_color: !lambda if (page == 3) return id(bg_blue); return id(white);

  - id: go_home
    then:
      - lvgl.widget.show: sidebar_obj
      - lvgl.page.show: home_page
      - script.execute:
          id: nav_set
          page: 0

  - id: go_climate
    then:
      - lvgl.widget.show: sidebar_obj
      - lvgl.page.show: climate_page
      - script.execute:
          id: nav_set
          page: 1

  - id: go_energy
    then:
      - lvgl.widget.show: sidebar_obj
      - lvgl.page.show: energy_page
      - script.execute:
          id: nav_set
          page: 2

  - id: go_settings
    then:
      - lvgl.widget.show: sidebar_obj
      - lvgl.page.show: settings_page
      - script.execute:
          id: nav_set
          page: 3

  - id: go_media
    then:
      - lvgl.widget.hide: sidebar_obj
      - lvgl.widget.hide: dl_backdrop
      - lvgl.widget.hide: dl_on
      - lvgl.widget.hide: dl_pl
      - lvgl.page.show: media_page
      - script.execute:
          id: nav_set
          page: 4

  - id: go_weather
    then:
      - lvgl.widget.show: sidebar_obj
      - lvgl.page.show: weather_page
      - script.execute:
          id: nav_set
          page: 5

  - id: all_lights_off
    then:
      - homeassistant.action:
          action: light.turn_off
          data:
            entity_id: ${all_lights_off}

  - id: goto_page
    parameters:
      page: int
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - lvgl.resume:
      - if:
          condition:
            lambda: return page == 0;
          then:
            - script.execute: go_home
      - if:
          condition:
            lambda: return page == 1;
          then:
            - script.execute: go_climate
      - if:
          condition:
            lambda: return page == 2;
          then:
            - script.execute: go_energy
      - if:
          condition:
            lambda: return page == 3;
          then:
            - script.execute: go_settings
      - if:
          condition:
            lambda: return page == 4;
          then:
            - script.execute: go_media
      - if:
          condition:
            lambda: return page == 5;
          then:
            - script.execute: go_weather

  - id: boot_seq
    then:
      - delay: 1s
      - lvgl.widget.hide: sidebar_obj
      - delay: 4s
      - script.execute: go_home

  - id: wake_tap
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(g_dim_tap) == "1";
          then:
            - lambda: |-
                id(g_dim_tap) = "0";
            - script.execute: screen_saver
          else:
            - if:
                condition:
                  lambda: return !id(backlight).remote_values.is_on();
                then:
                  - script.stop: screen_saver
                  - lambda: |-
                      id(g_dim_tap) = "1";
                      id(g_on_saver) = "1";
                  - lvgl.widget.hide: sidebar_obj
                  - lvgl.page.show: saver_page
                  - light.turn_on:
                      id: backlight
                      brightness: 0.25
                      transition_length: 200ms
                  - delay: 5s
                  - if:
                      condition:
                        lambda: return id(g_dim_tap) == "1";
                      then:
                        - lambda: |-
                            id(g_dim_tap) = "0";
                        - light.turn_off:
                            id: backlight
                            transition_length: 2s
                else:
                  - script.execute: screen_saver

  - id: screen_saver
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(g_on_saver) == "1";
          then:
            - lambda: |-
                id(g_on_saver) = "0";
            - script.execute:
                id: goto_page
                page: !lambda return id(g_page);
      - light.turn_on:
          id: backlight
          brightness: 1.0
          transition_length: 300ms
      - delay: 3min
      - if:
          condition:
            lambda: |-
              auto t = id(sntp_time).now();
              int s = atoi(id(g_sleep_start).c_str());
              int e = atoi(id(g_sleep_end).c_str());
              if (s == e) return false;
              if (s < e) return t.hour >= s && t.hour < e;
              return t.hour >= s || t.hour < e;
          then:
            - light.turn_off:
                id: backlight
                transition_length: 2s
          else:
            - lvgl.widget.hide: sidebar_obj
            - lvgl.page.show: saver_page
            - lambda: |-
                id(g_on_saver) = "1";
            - light.turn_on:
                id: backlight
                brightness: 0.25
                transition_length: 2s
            - delay: 1min
            - light.turn_off:
                id: backlight
                transition_length: 2s

  - id: sync_media
    mode: single
    then:
      - homeassistant.action:
          action: script.cyd_media_sync
          data:
            media_entity: !lambda return id(g_media);
          capture_response: true
          on_success:
            - lambda: |-
                JsonObjectConst resp = response["response"].isNull() ? response : response["response"].as<JsonObjectConst>();
                if (resp["devices"].isNull() && !resp["service_response"].isNull())
                  resp = resp["service_response"].as<JsonObjectConst>();
                static bool logged = false;
                if (!logged) {
                  logged = true;
                  std::string ks;
                  for (JsonPairConst kv : resp) {
                    ks += kv.key().c_str();
                    ks += " ";
                  }
                  ESP_LOGW("cyd_media", "resp keys: %s", ks.c_str());
                }
                JsonArrayConst devs = resp["devices"].as<JsonArrayConst>();
                std::string did[8], dnm[8];
                int n = 0;
                for (JsonVariantConst v : devs) {
                  if (n >= 8) break;
                  JsonObjectConst d = v.as<JsonObjectConst>();
                  did[n] = d["e"] | "";
                  dnm[n] = d["n"] | "";
                  n++;
                }
                id(g_d1) = did[0]; id(g_d2) = did[1]; id(g_d3) = did[2]; id(g_d4) = did[3]; id(g_d5) = did[4]; id(g_d6) = did[5]; id(g_d7) = did[6]; id(g_d8) = did[7];
                id(g_d1n) = dnm[0]; id(g_d2n) = dnm[1]; id(g_d3n) = dnm[2]; id(g_d4n) = dnm[3]; id(g_d5n) = dnm[4]; id(g_d6n) = dnm[5]; id(g_d7n) = dnm[6]; id(g_d8n) = dnm[7];
                bool found = false;
                for (int i = 0; i < n; i++)
                  if (id(g_media) == did[i]) found = true;
                if (!found && n > 0) id(g_media) = did[0];
                lv_obj_t *btns[8] = {id(dev1_btn), id(dev2_btn), id(dev3_btn), id(dev4_btn), id(dev5_btn), id(dev6_btn), id(dev7_btn), id(dev8_btn)};
                lv_obj_t *lbls[8] = {id(dev1_name), id(dev2_name), id(dev3_name), id(dev4_name), id(dev5_name), id(dev6_name), id(dev7_name), id(dev8_name)};
                for (int i = 0; i < 8; i++) {
                  if (i < n) {
                    lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                    lv_label_set_text(lbls[i], dnm[i].c_str());
                    if (id(g_media) == did[i]) lv_obj_add_state(btns[i], LV_STATE_CHECKED);
                    else lv_obj_clear_state(btns[i], LV_STATE_CHECKED);
                  } else {
                    lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_clear_state(btns[i], LV_STATE_CHECKED);
                  }
                }
                JsonObjectConst now = resp["now"].as<JsonObjectConst>();
                id(g_st) = now["state"] | "off";
                id(g_ti) = now["title"] | "";
                id(g_ar) = now["artist"] | "";
                id(g_fav) = resp["fav"] | "";
                JsonArrayConst pls = resp["playlists"].as<JsonArrayConst>();
                JsonArrayConst urs = resp["uris"].as<JsonArrayConst>();
                std::string pn[6], pu[6];
                int i2 = 0;
                for (JsonVariantConst v : pls) {
                  if (i2 >= 6) break;
                  pn[i2] = v | "";
                  i2++;
                }
                i2 = 0;
                for (JsonVariantConst v : urs) {
                  if (i2 >= 6) break;
                  pu[i2] = v | "";
                  i2++;
                }
                id(g_pl1) = pn[0]; id(g_pl2) = pn[1]; id(g_pl3) = pn[2]; id(g_pl4) = pn[3]; id(g_pl5) = pn[4]; id(g_pl6) = pn[5];
                id(g_u1) = pu[0]; id(g_u2) = pu[1]; id(g_u3) = pu[2]; id(g_u4) = pu[3]; id(g_u5) = pu[4]; id(g_u6) = pu[5];
                auto as_bool = [](JsonVariantConst v, bool def) -> bool {
                  if (v.is<bool>()) return v.as<bool>();
                  if (v.is<int>()) return v.as<int>() != 0;
                  if (v.is<const char *>()) {
                    std::string s = v.as<const char *>();
                    return s == "True" || s == "true" || s == "1";
                  }
                  return def;
                };
                bool wx = as_bool(resp["wx"], true);
                bool ot = as_bool(resp["ot"], true);
                bool cl = as_bool(resp["cl"], true);
                id(g_fav_on) = as_bool(resp["fav_on"], false) ? "1" : "0";
                {
                  float nv = resp["vol"] | 0.0f;
                  if (isnan(nv)) nv = 0.0f;
                  if ((uint32_t)(millis() - id(g_vol_ms)) > 5000) {
                    id(g_vol) = nv;
                    int vip = (int)(nv * 100.0f + 0.5f);
                    lv_slider_set_value(id(vol_slider), vip, LV_ANIM_OFF);
                    char vb[8];
                    snprintf(vb, sizeof(vb), "%d%%", vip);
                    lv_label_set_text(id(vol_pct), vb);
                  }
                }
                {
                  std::string pic = resp["pic"] | "";
                  if (pic != id(g_pic)) {
                    if (!pic.empty()) {
                      if (millis() > 45000) {
                        id(g_pic) = pic;
                        ESP_LOGW("cyd_pic", "fetch: %s", pic.c_str());
                        id(album_art).set_url(pic);
                        id(album_art).update();
                      } else {
                        ESP_LOGW("cyd_pic", "boot skip art (uptime %lu)", (unsigned long) millis());
                      }
                    } else {
                      id(g_pic) = pic;
                      id(album_art).release();
                      lv_obj_add_flag(id(art_img), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(art_icon), LV_OBJ_FLAG_HIDDEN);
                    }
                  }
                }
                lv_obj_t *vbv[3] = {id(vol_icon), id(vol_slider), id(vol_pct)};
                for (int i = 0; i < 3; i++) {
                  if (n > 0) lv_obj_clear_flag(vbv[i], LV_OBJ_FLAG_HIDDEN);
                  else lv_obj_add_flag(vbv[i], LV_OBJ_FLAG_HIDDEN);
                }
                lv_obj_t *wxobjs[3] = {id(display_weather_icon), id(display_weather_text), id(wx_tap)};
                for (int i = 0; i < 3; i++) {
                  if (wx) lv_obj_clear_flag(wxobjs[i], LV_OBJ_FLAG_HIDDEN);
                  else lv_obj_add_flag(wxobjs[i], LV_OBJ_FLAG_HIDDEN);
                }
                bool show_ot = wx && ot;
                lv_obj_t *otobjs[2] = {id(display_out_temp_icon), id(display_out_temp)};
                for (int i = 0; i < 2; i++) {
                  if (show_ot) lv_obj_clear_flag(otobjs[i], LV_OBJ_FLAG_HIDDEN);
                  else lv_obj_add_flag(otobjs[i], LV_OBJ_FLAG_HIDDEN);
                }
                lv_obj_t *itobjs[2] = {id(display_in_temp_icon), id(display_in_temp)};
                for (int i = 0; i < 2; i++) {
                  if (cl) lv_obj_clear_flag(itobjs[i], LV_OBJ_FLAG_HIDDEN);
                  else lv_obj_add_flag(itobjs[i], LV_OBJ_FLAG_HIDDEN);
                }
                lv_obj_set_style_translate_x(id(display_in_temp_icon), show_ot ? 6 : -14, LV_PART_MAIN);
                lv_obj_set_style_translate_x(id(display_in_temp), show_ot ? 28 : 8, LV_PART_MAIN);
                if (n > 0) lv_obj_clear_flag(id(np_card), LV_OBJ_FLAG_HIDDEN);
                else lv_obj_add_flag(id(np_card), LV_OBJ_FLAG_HIDDEN);
                if (n > 0) lv_obj_clear_flag(id(pop_on_btn), LV_OBJ_FLAG_HIDDEN);
                else lv_obj_add_flag(id(pop_on_btn), LV_OBJ_FLAG_HIDDEN);
                if (id(g_fav).empty() || id(g_fav) == "unknown" || id(g_fav) == "None")
                  lv_obj_add_flag(id(mfav), LV_OBJ_FLAG_HIDDEN);
                else lv_obj_clear_flag(id(mfav), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGW("cyd_media", "sync n=%d media=%s st=%s ti=%s", n, id(g_media).c_str(), id(g_st).c_str(), id(g_ti).c_str());
            - script.execute: update_media
            - script.execute: update_playlists
          on_error:
            - lambda: |-
                ESP_LOGW("cyd_media", "sync failed: %s", error.c_str());

  - id: update_media
    then:
      - lvgl.label.update:
          id: np_title
          text: !lambda |-
            std::string s = id(g_st);
            if (s != "playing" && s != "paused") return {"Nothing playing"};
            std::string t = id(g_ti);
            if (t.empty() || t == "unknown" || t == "None") t = "Playing";
            if (t.length() > 140) t = t.substr(0, 137) + "...";
            std::string a = id(g_ar);
            if (!a.empty() && a != "unknown" && a != "None") t += "  -  " + a;
            return {t};
      - lvgl.label.update:
          id: np2_title
          text: !lambda |-
            std::string s = id(g_st);
            if (s != "playing" && s != "paused") return {"Nothing playing"};
            std::string t = id(g_ti);
            if (t.empty() || t == "unknown" || t == "None") t = "Playing";
            if (t.length() > 140) t = t.substr(0, 137) + "...";
            return {t};
      - lvgl.label.update:
          id: np2_artist
          text: !lambda |-
            std::string s = id(g_st);
            if (s != "playing" && s != "paused") return {""};
            std::string a = id(g_ar);
            if (a.empty() || a == "unknown" || a == "None") return {""};
            return {a};
      - lvgl.label.update:
          id: saver_np
          text: !lambda |-
            std::string s = id(g_st);
            if (s != "playing" && s != "paused") return {"Nothing playing"};
            std::string t = id(g_ti);
            if (t.empty() || t == "unknown" || t == "None") t = "Playing";
            if (t.length() > 60) t = t.substr(0, 57) + "...";
            return {t};
      - lvgl.label.update:
          id: np2_state
          text: !lambda |-
            std::string s = id(g_st);
            if (s == "playing") return {"Playing"};
            if (s == "paused") return {"Paused"};
            if (s == "idle") return {"Idle"};
            if (s == "off") return {"Off"};
            return {"--"};
      - lvgl.label.update:
          id: mpp_icon
          text: !lambda |-
            std::string s = id(g_st);
            if (s == "playing") return {"\U000F03E4"};
            return {"\U000F040A"};
      - lvgl.label.update:
          id: mfav_icon
          text: !lambda |-
            if (id(g_fav_on) == "1") return {"\U000F02D1"};
            return {"\U000F02D5"};
      - lvgl.label.update:
          id: pop_on_label
          text: !lambda |-
            std::string n = "";
            if (id(g_media) == id(g_d1)) n = id(g_d1n);
            else if (id(g_media) == id(g_d2)) n = id(g_d2n);
            else if (id(g_media) == id(g_d3)) n = id(g_d3n);
            else if (id(g_media) == id(g_d4)) n = id(g_d4n);
            else if (id(g_media) == id(g_d5)) n = id(g_d5n);
            else if (id(g_media) == id(g_d6)) n = id(g_d6n);
            else if (id(g_media) == id(g_d7)) n = id(g_d7n);
            else if (id(g_media) == id(g_d8)) n = id(g_d8n);
            if (n.empty() || n == "unknown" || n == "None" || n == "--") return {"Play On"};
            return {n};
      - lvgl.widget.update:
          id: np_icon
          text_color: !lambda |-
            std::string s = id(g_st);
            if (s == "playing") return id(amber);
            if (s == "paused") return id(yellow);
            return id(light_blue);
      - lvgl.widget.update:
          id: np2_state
          text_color: !lambda |-
            std::string s = id(g_st);
            if (s == "playing") return id(amber);
            if (s == "paused") return id(yellow);
            return id(lilac);
      - lvgl.widget.update:
          id: dev1_btn
          state:
            checked: !lambda return !id(g_d1).empty() && id(g_media) == id(g_d1);
      - lvgl.widget.update:
          id: dev2_btn
          state:
            checked: !lambda return !id(g_d2).empty() && id(g_media) == id(g_d2);
      - lvgl.widget.update:
          id: dev3_btn
          state:
            checked: !lambda return !id(g_d3).empty() && id(g_media) == id(g_d3);
      - lvgl.widget.update:
          id: dev4_btn
          state:
            checked: !lambda return !id(g_d4).empty() && id(g_media) == id(g_d4);
      - lvgl.widget.update:
          id: dev5_btn
          state:
            checked: !lambda return !id(g_d5).empty() && id(g_media) == id(g_d5);
      - lvgl.widget.update:
          id: dev6_btn
          state:
            checked: !lambda return !id(g_d6).empty() && id(g_media) == id(g_d6);
      - lvgl.widget.update:
          id: dev7_btn
          state:
            checked: !lambda return !id(g_d7).empty() && id(g_media) == id(g_d7);
      - lvgl.widget.update:
          id: dev8_btn
          state:
            checked: !lambda return !id(g_d8).empty() && id(g_media) == id(g_d8);
      - lambda: |-
          lv_obj_t *icons[8] = {id(dev1_icon), id(dev2_icon), id(dev3_icon), id(dev4_icon), id(dev5_icon), id(dev6_icon), id(dev7_icon), id(dev8_icon)};
          lv_obj_t *names[8] = {id(dev1_name), id(dev2_name), id(dev3_name), id(dev4_name), id(dev5_name), id(dev6_name), id(dev7_name), id(dev8_name)};
          std::string ids[8] = {id(g_d1), id(g_d2), id(g_d3), id(g_d4), id(g_d5), id(g_d6), id(g_d7), id(g_d8)};
          for (int i = 0; i < 8; i++) {
            bool sel = !ids[i].empty() && id(g_media) == ids[i];
            lv_color_t c = sel ? lv_color_hex(0x0B1F33) : lv_color_hex(0xFFFFFF);
            lv_obj_set_style_text_color(icons[i], c, LV_PART_MAIN);
            lv_obj_set_style_text_color(names[i], c, LV_PART_MAIN);
          }

  - id: update_vol_ui
    then:
      - lambda: |-
          int vip = (int)(id(g_vol) * 100.0f + 0.5f);
          if (vip < 0) vip = 0;
          if (vip > 100) vip = 100;
          lv_slider_set_value(id(vol_slider), vip, LV_ANIM_OFF);
          char vb[8];
          snprintf(vb, sizeof(vb), "%d%%", vip);
          lv_label_set_text(id(vol_pct), vb);
  - id: update_playlists
    then:
      - lambda: |-
          lv_obj_t *btns[6] = {id(pl1_btn), id(pl2_btn), id(pl3_btn), id(pl4_btn), id(pl5_btn), id(pl6_btn)};
          std::string names[6] = {id(g_pl1), id(g_pl2), id(g_pl3), id(g_pl4), id(g_pl5), id(g_pl6)};
          bool any = false;
          for (int i = 0; i < 6; i++) {
            if (names[i].empty() || names[i] == "unknown" || names[i] == "None")
              lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
              any = true;
            }
          }
          if (any) lv_obj_clear_flag(id(pop_pl_btn), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(pop_pl_btn), LV_OBJ_FLAG_HIDDEN);
      - lvgl.label.update:
          id: pl1_label
          text: !lambda |-
            std::string p = id(g_pl1);
            if (p.empty() || p == "unknown" || p == "None") return {"No playlists"};
            if (p.length() > 30) p = p.substr(0, 28) + "..";
            return {p};
      - lvgl.label.update:
          id: pl2_label
          text: !lambda |-
            std::string p = id(g_pl2);
            if (p.empty() || p == "unknown" || p == "None") return {""};
            if (p.length() > 30) p = p.substr(0, 28) + "..";
            return {p};
      - lvgl.label.update:
          id: pl3_label
          text: !lambda |-
            std::string p = id(g_pl3);
            if (p.empty() || p == "unknown" || p == "None") return {""};
            if (p.length() > 30) p = p.substr(0, 28) + "..";
            return {p};
      - lvgl.label.update:
          id: pl4_label
