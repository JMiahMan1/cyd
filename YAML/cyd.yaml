      height: 100%
      bg_color: 0xEFE7F3
      bg_grad_color: 0xE2D5EA
      bg_grad_dir: VER
      border_width: 0
      radius: 0
      pad_all: 0
      text_color: 0x3A1533
      align: TOP_RIGHT

    - id: card
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0xE3D6E9
      border_width: 1
      radius: 14
      pad_all: 0
      shadow_color: 0x000000
      shadow_ofs_x: 0
      shadow_ofs_y: 3
      shadow_spread: 0
      shadow_width: 10
      shadow_opa: 25%
      text_color: 0x3A1533

    - id: hero
      bg_color: 0x7B2D5E
      bg_grad_color: 0x4A1F45
      bg_grad_dir: VER
      border_color: 0x9C6091
      border_width: 1
      radius: 14
      pad_all: 0
      shadow_color: 0x000000
      shadow_ofs_x: 0
      shadow_ofs_y: 3
      shadow_spread: 0
