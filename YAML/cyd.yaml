substitutions:
  name: jarvis-cyd2
  friendly_name: cyd2-jarvis
  api_key: !secret api_key

  weather_entity: weather.forecast
  out_temp_entity: sensor.outside_temperature

  ds_climate: climate.downstairs
  us_climate: climate.tstat_3692f3_t5_thermostat

  cur_power_entity: sensor.rosebud_123_1min
  daily_energy_entity: sensor.rosebud_123_1d
  monthly_energy_entity: sensor.rosebud_123_1mon
  energy_cost_entity: sensor.rosebud_123_1d_cost

  garage_switch: switch.garage_door_2
  garage_sensor: binary_sensor.garage_door_sensor

  light_kitchen: light.kitchen_light_1
  light_kitchen_all: light.kitchen_light_1,light.kitchen_light_2,light.kitchen_light_3,light.kitchen_light_4,light.kitchen_light_5,light.kitchen_light_6
  light_bath: light.upstairs_bathroom_1
  light_bath_all: light.upstairs_bathroom_1,light.upstairs_bathroom_2,light.upstairs_bathroom_3
  light_master_left: light.master_bedroom_lamp_left
  light_master_right: light.master_bedroom_lamp_right
  light_hall: light.hall_lamp
  all_lights_off: light.master_bedroom_lamp_left,light.master_bedroom_lamp_right,light.hall_lamp,light.kitchen_light_1,light.kitchen_light_2,light.kitchen_light_3,light.kitchen_light_4,light.kitchen_light_5,light.kitchen_light_6,light.upstairs_bathroom_1,light.upstairs_bathroom_2,light.upstairs_bathroom_3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.flash_size: 8MB
  on_boot:
    priority: -100
    then:
      - script.execute: boot_seq
      - script.execute: screen_saver
      - script.execute: update_playlists
      - script.execute: sync_media
      - script.execute: update_unit_ui
      - script.execute: update_clock_ui

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
  flash_size: 8MB

api:
  encryption:
    key: ${api_key}
  on_client_connected:
    - homeassistant.action:
        action: automation.trigger
        data:
          entity_id: automation.cyd_playlists_sync
    - homeassistant.action:
        action: automation.trigger
        data:
          entity_id: automation.cyd_weather_sync
  services:
    - service: show_page
      variables:
        page: int
      then:
        - script.execute:
            id: goto_page
            page: !lambda return page;
    - service: show_dlg
      variables:
        dlg: int
      then:
        - script.execute: go_media
        - if:
            condition:
              lambda: return dlg == 1;
            then:
              - lvgl.widget.show: dl_backdrop
              - lvgl.widget.show: dl_on
              - lvgl.widget.hide: dl_pl
            else:
              - if:
                  condition:
                    lambda: return dlg == 2;
                  then:
                    - lvgl.widget.show: dl_backdrop
                    - lvgl.widget.show: dl_pl
                    - lvgl.widget.hide: dl_on
                  else:
                    - lvgl.widget.hide: dl_backdrop
                    - lvgl.widget.hide: dl_on
                    - lvgl.widget.hide: dl_pl
    - service: set_playlists
      variables:
        p1: string
        p2: string
        p3: string
        u1: string
        u2: string
        u3: string
      then:
        - lambda: |-
            id(g_pl1) = p1;
            id(g_pl2) = p2;
            id(g_pl3) = p3;
            id(g_u1) = u1;
            id(g_u2) = u2;
            id(g_u3) = u3;
        - script.execute: update_playlists
    - service: set_weather
      variables:
        n1: string
        c1: string
        h1: string
        l1: string
        n2: string
        c2: string
        h2: string
        l2: string
        n3: string
        c3: string
        h3: string
        l3: string
        n4: string
        c4: string
        h4: string
        l4: string
      then:
        - lambda: |-
            auto icon = [](const std::string &s) -> const char* {
              if (s == "clear-night") return "\U000F0594";
              if (s == "cloudy") return "\U000F0590";
              if (s == "exceptional") return "\U000F0F37";
              if (s == "fog") return "\U000F0591";
              if (s == "hail") return "\U000F0592";
              if (s == "lightning") return "\U000F0593";
              if (s == "lightning-rainy") return "\U000F067E";
              if (s == "partlycloudy") return "\U000F0595";
              if (s == "pouring") return "\U000F0596";
              if (s == "rainy") return "\U000F0597";
              if (s == "snowy") return "\U000F0598";
              if (s == "snowy-rainy") return "\U000F067F";
              if (s == "sunny") return "\U000F0599";
              if (s == "windy") return "\U000F059D";
              if (s == "windy-variant") return "\U000F059E";
              return "\U000F0590";
            };
            auto clean = [](std::string v) -> std::string {
              if (v.empty() || v == "unknown" || v == "None" || v == "unavailable") return "--";
              return v;
            };
            auto num = [](const std::string &v) -> float {
              if (v.empty() || v == "unknown" || v == "None" || v == "unavailable") return NAN;
              return atof(v.c_str());
            };
            lv_label_set_text(id(wx_day1), clean(n1).c_str());
            lv_label_set_text(id(wx_icon1), icon(c1));
            lv_label_set_text(id(wx_day2), clean(n2).c_str());
            lv_label_set_text(id(wx_icon2), icon(c2));
            lv_label_set_text(id(wx_day3), clean(n3).c_str());
            lv_label_set_text(id(wx_icon3), icon(c3));
            lv_label_set_text(id(wx_day4), clean(n4).c_str());
            lv_label_set_text(id(wx_icon4), icon(c4));
            id(g_w1h) = num(h1); id(g_w1l) = num(l1);
            id(g_w2h) = num(h2); id(g_w2l) = num(l2);
            id(g_w3h) = num(h3); id(g_w3l) = num(l3);
            id(g_w4h) = num(h4); id(g_w4l) = num(l4);
        - script.execute: update_weather_temps

